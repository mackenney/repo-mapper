[package]
name = "repo-mapper"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Token-budget-respecting repository map generator — ranked structural summary of a codebase"
license = "Apache-2.0"
repository = "https://github.com/mackenney/repo-mapper"
documentation = "https://docs.rs/repo-mapper"
readme = "README.md"
keywords = ["repomap", "treesitter", "pagerank", "llm", "codebase"]
categories = ["development-tools", "command-line-utilities", "parsing"]

[features]
default = ["cli"]
cli = ["dep:clap", "dep:ignore", "dep:tracing-subscriber", "dep:indicatif"]

[profile.dev]
debug = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[profile.dev.package."*"]
# change provisionally! to debug=1/2 if more debug info is needed
# this is here for target/ dir bloat
debug = "line-tables-only"

[dependencies]
# Tree-sitter parsing
tree-sitter = "0.26"
tree-sitter-language-pack = "1.8"  # requires tree-sitter 0.26

# Compile-time maps for language detection
phf = { version = "0.11", features = ["macros"] }

# Graph algorithms
petgraph = "0.6"

# Serialization for caches
serde = { version = "1", features = ["derive"] }
bincode = "1"

# Persistent tag cache
rusqlite = { version = "0.32", features = ["bundled"] }

# Token counting
tiktoken-rs = "0.6"

# Path handling
pathdiff = "0.2"

# Logging/diagnostics
tracing = "0.1"

# CLI binary (gated behind the `cli` feature, on by default)
clap = { version = "4", features = ["derive"], optional = true }
ignore = { version = "0.4", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
indicatif = { version = "0.17", optional = true }

# Error handling
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "repo-mapper"
path = "src/bin/repo-mapper.rs"
required-features = ["cli"]
